              <div class="input-group mb-3">
                <input type="file" class="form-control" id="logotipo" />
                <div class="input-group-text">

              <div class="input-group mb-3">

                  placeholder="Nome da empresa"
                  id="nome"
                />
                <div class="input-group-text">
                  <span class="bi bi-person"></span>

              </div>
              <div class="input-group mb-3">
                <input
                  type="url"
                  class="form-control"
                  placeholder="https://www.empresa.co"
                  id="site"
                />
                <div class="input-group-text">
                  <span class="bi bi-person"></span>
                </div>
              </div>
              <div class="input-group mb-3">
                <input
                  type="text"
                  class="form-control"
                  placeholder="Estado/cidade"
                  id="endereco"
                />
                <div class="input-group-text">
                  <span class="bi bi-envelope"></span>
                </div>
              </div>
              <div class="input-group mb-3">
                <input
                  type="text"
                  class="form-control"
                  placeholder="NIF"
                  id="NIF"
                />
                <div class="input-group-text">
                  <span class="bi bi-lock-fill"></span>
                </div>
              </div>
              <div class="mb-3">
                <label for="descricao">Sobre a empresa</label>
                <div class="input-group mb-3">
                  <textarea class="form-control" id="descricao"></textarea>
                </div>
              </div>
              <div class="mb-3">
                <p
                  class="alert alert-danger"

                <!-- /.col -->

    <script src="../admin/js/empresaDAO.js"></script>
    <script>
      empresa = new EmpresaDAO(
        `Bearer ${localStorage.getItem("token") || ""}`,
        "http://localhost:3000"
      );

      //UPLOADS FILE
      async function upload(file) {
        const form = new FormData();

        form.append("file", file);
        return await fetch("http://localhost:3000/uploads", {
          method: "POST",
          body: form,
          headers: {
            //"Content-Type": "multipart/form-data",
            authorization: "Bearer " + localStorage.getItem("token"),
          },
        })
          .then((res) => res.json())
          .then((data) => data);
      }

      document.querySelector("#btnSigIn").onclick = async function (ev) {
        ev.preventDefault();
        const msgAuth = document.querySelector("#msgAuth");
        const loading = document.querySelector("#loading");
        loading.style.display = "block";

        const file = await upload(
          document.querySelector("#logotipo")?.files[0]
        );
        const data = await empresa.create({
          logotipo: file.foto || "",
          nome: document.querySelector("#nome").value,
          site: document.querySelector("#site").value,
          endereco: document.querySelector("#endereco").value,
          NIF: document.querySelector("#NIF").value,
          descricao: document.querySelector("#descricao").value,
          password: "123456",
        });

        msgAuth.style.display = loading.style.display = "none";
        console.log(data);

        if (!data || data.erro) {
          msgAuth.innerText = data.erro || "Erro ao cadastrar empresa";
          msgAuth.style.display = "block";
          return;
        }

        localStorage.setItem("token", `${data.token}`);
        localStorage.setItem("user", JSON.stringify(data.user));
        //location.href = "../index.html";
      };
    </script>
