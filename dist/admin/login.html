  <!--begin::Body-->
  <body class="login-page bg-body-secondary">
    <div class="text-warning text-uppercase h5">
      <!-- <span>K - food</span> -->
    </div>
    <div style="display: flex; flex-wrap: wrap">
      <div class="login-box">
        <!-- /.login-logo -->
        <div class="card" style="height: 100%; width: 100%">
          <div class="card-body login-card-body relative">
            <div
              class="spinner-border text-warning"
              role="status"
              id="loading"
              style="
                position: absolute;
                top: 50%;
                bottom: 10%;
                left: 50%;
                right: 50%;
                z-index: 1;
                display: none;
              "
            >
              <span class="visually-hidden">Loading...</span>
            </div>
            <div class="d-flex justify-content-between align-items-center">
              <p class="text-warning">K-FOOD</p>
              <p class="">Iniciar sessão</p>
            </div>
            <form action="http://localhost:3000/login" method="post">
              <div class="input-group mb-3">
                <input
                  type="text"
                  class="form-control"
                  placeholder="NIF"
                  id="nif"
                />
                <div class="input-group-text">
                  <span class="bi bi-envelope"></span>
                </div>
              </div>
              <div class="input-group mb-3">
                <input
                  type="password"
                  class="form-control"
                  placeholder="Password"
                  id="password"
                />
                <div class="input-group-text">
                  <span class="bi bi-lock-fill"></span>
                </div>
              </div>
              <div class="mb-3">
                <p class="text-danger" id="msgAuth" style="display: none"></p>
              </div>
              <!--begin::Row-->
              <div class="row">
                <div class="col-8">
                  <div class="form-check">
                    <input
                      class="form-check-input"
                      type="checkbox"
                      value=""
                      id="flexCheckDefault"
                    />
                    <label class="form-check-label" for="flexCheckDefault">
                      Lembrar - me
                    </label>
                  </div>
                </div>
                <!-- /.col -->
                <div class="col-4">
                  <div class="d-grid gap-2">
                    <button
                      type="button"
                      class="btn btn-warning text-white"
                      id="btnSigIn"
                    >
                      Entrar
                    </button>
                  </div>
                </div>
                <!-- /.col -->
              </div>
              <!--end::Row-->
            </form>
            <!-- /.social-auth-links -->
            <p class="mb-1">
              <a href="forgot-password.html">Esqueceu a senha?</a>
            </p>
            <p class="mb-0">
              <a href="register.html" class="text-center"> Nova conta </a>
            </p>
          </div>
          <!-- /.login-card-body -->
        </div>
      </div>
    </div>
    <!-- /.login-box -->
    <!--begin::Third Party Plugin(OverlayScrollbars)-->
    <script
      src="https://cdn.jsdelivr.net/npm/overlayscrollbars@2.11.0/browser/overlayscrollbars.browser.es6.min.js"
      crossorigin="anonymous"
    ></script>
    <!--end::Third Party Plugin(OverlayScrollbars)--><!--begin::Required Plugin(popperjs for Bootstrap 5)-->
    <script
      src="https://cdn.jsdelivr.net/npm/@popperjs/core@2.11.8/dist/umd/popper.min.js"
      crossorigin="anonymous"
    ></script>
    <!--end::Required Plugin(popperjs for Bootstrap 5)--><!--begin::Required Plugin(Bootstrap 5)-->
    <script
      src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/js/bootstrap.min.js"
      crossorigin="anonymous"
    ></script>
    <!--end::Required Plugin(Bootstrap 5)--><!--begin::Required Plugin(AdminLTE)-->
    <script src="../js/adminlte.js"></script>
    <!--end::Required Plugin(AdminLTE)--><!--begin::OverlayScrollbars Configure-->
    <script>
      const SELECTOR_SIDEBAR_WRAPPER = ".sidebar-wrapper";
      const Default = {
        scrollbarTheme: "os-theme-light",
        scrollbarAutoHide: "leave",
        scrollbarClickScroll: true,
      };
      document.addEventListener("DOMContentLoaded", function () {
        const sidebarWrapper = document.querySelector(SELECTOR_SIDEBAR_WRAPPER);
        if (
          sidebarWrapper &&
          OverlayScrollbarsGlobal?.OverlayScrollbars !== undefined
        ) {
          OverlayScrollbarsGlobal.OverlayScrollbars(sidebarWrapper, {
            scrollbars: {
              theme: Default.scrollbarTheme,
              autoHide: Default.scrollbarAutoHide,
              clickScroll: Default.scrollbarClickScroll,
            },
          });
        }
      });
    </script>
    <!--end::OverlayScrollbars Configure-->
    <!--end::Script-->

    <script src="../admin/js/Auth.js"></script>
    <script>
      document.querySelector("#btnSigIn").onclick = async function () {
        const msgAuth = document.querySelector("#msgAuth");
        const loading = document.querySelector("#loading");
        loading.style.display = "block";

        const nif = document.querySelector("#nif").value;
        const password = document.querySelector("#password").value;
        const data = await Auth.login(nif, password);
        loading.style.display = msgAuth.style.display = "none";
        console.log(data, Auth.logged);

        if (!Auth.isLogged()) {
          msgAuth.innerText = data.msg;
          msgAuth.style.display = "block";
          return;
        }

        localStorage.setItem("token", `${data.token}`);
        localStorage.setItem("user", JSON.stringify(data.user));
        location.href = "../index.html";
      };
    </script>
  </body>
