<!DOCTYPE html>
<html lang="pt-br">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>K - food services</title>

    <style>
      * {
        padding: 0;
        margin: 0;
      }
      header {
        display: flex;
        justify-content: center;
        align-items: center;
        gap: 20px;
        max-width: 992px;
        margin: auto;
        flex-wrap: wrap;
        padding: 40px 10px;
        border-bottom: 1px solid lightgrey;
      }
      header ul {
        display: flex;
        gap: 10px;
      }
      header h1 a {
        color: rgba(255, 166, 0, 0.61);
      }
      header ul a {
        color: black;
        padding: 10px;
      }
      ul {
        list-style: none;
      }
      a {
        text-decoration: none;
      }

      .destaque {
        text-align: center;
        padding: 10px;
        height: 60vh;
        color: white;
        display: flex;
        flex-direction: column;
        justify-content: center;
        background-repeat: no-repeat;
        background-position: center;
        margin-top: 10px;
        background-image: linear-gradient(rgba(0, 0, 0, 0.7)),
          url(./assets/img/photo1.png);
      }
      .destaque h2 {
        color: rgba(255, 166, 0, 1);
        margin: 20px;
      }

      .produtos {
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        max-width: 992px;
        margin: 30px auto;
      }

      .produtos p {
        margin: 5px 0 50px;
      }

      .produto {
        display: flex;
        flex-wrap: wrap;
        justify-content: center;
        align-items: center;
        gap: 30px;
        row-gap: 50px;
      }
      .produtos figure {
        width: 300px;
        height: 150px;
      }
      .produto figure:hover img {
        transition: 0.5s;
        transform: scale(1.1);
      }
      .produtos figcaption {
        display: flex;
        justify-content: space-between;
        align-items: center;
        gap: 10px;
        margin-top: 5px;
        color: gray;
      }
      .detalhesBtn {
        display: none;
        position: absolute;
        top: 35%;
        bottom: 40%;
        text-align: center;
        padding: 10px;
        border-radius: 30px;
        left: 20%;
        right: 20%;
        color: orange;
        text-transform: capitalize;
        text-shadow: 1px 1px 1px black;
        border: 1px solid;
        transition: 1s;
      }
      .produto figure:hover ~ .detalhesBtn {
        display: block;
      }
      img {
        width: 100%;
        height: 90%;
        border-radius: 10px;
      }

      @media (min-width: 992px) {
        .produto figure {
          width: 200px;
        }
        .destaque {
          background-size: cover;
        }
      }
    </style>
  </head>
